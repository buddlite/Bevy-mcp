name: Apply S1-S4 integration

on:
  push:
    branches:
      - agent/debugging-intelligence-s1-s4
    paths:
      - .github/workflows/apply-s1-s4.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/debugging-intelligence-s1-s4
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Apply, validate, and publish integrated implementation
        shell: bash
        run: |
          set +e
          rm -f integration-failure.log
          {
            set -x
            python scripts/patch_s1.py
            python scripts/patch_s2a.py
            python scripts/patch_s2b.py
            python scripts/patch_s4_1.py
            python scripts/patch_s4_2.py
            python scripts/patch_s4_3.py
            cargo fmt --all
            cargo check --workspace --all-targets
          } > integration-run.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            cp integration-run.log integration-failure.log
            git add -- integration-failure.log
            git commit -m "Record S1-S4 integration failure" || true
            git push origin HEAD:agent/debugging-intelligence-s1-s4
            exit "$status"
          fi

          rm -f scripts/patch_s1.py scripts/patch_s2a.py scripts/patch_s2b.py scripts/patch_s4_1.py scripts/patch_s4_2.py scripts/patch_s4_3.py
          rm -f .github/workflows/apply-s1-s4.yml integration-run.log integration-failure.log
          git add -- \
            crates/bevy-mcp-core/src/advanced.rs \
            crates/bevy-mcp-core/src/debug.rs \
            crates/bevy-mcp-host/src/advanced.rs \
            crates/bevy-mcp-host/src/agent_api.rs \
            crates/bevy-mcp-host/src/change_tracking.rs \
            crates/bevy-mcp-host/src/checkpoint.rs \
            crates/bevy-mcp-host/src/debugger.rs \
            crates/bevy-mcp-host/src/lib.rs \
            crates/bevy-mcp-host/src/plugin.rs \
            crates/bevy-mcp-host/tests/intelligence.rs \
            crates/bevy-mcp-server/src/advanced_tools.rs \
            crates/bevy-mcp-server/src/debug_tools.rs \
            crates/bevy-mcp-server/src/lib.rs \
            crates/bevy-mcp-server/src/response_dispatcher.rs \
            crates/bevy-mcp-server/src/tools.rs \
            docs/debugging-intelligence.md \
            scripts/patch_s1.py \
            scripts/patch_s2a.py \
            scripts/patch_s2b.py \
            scripts/patch_s4_1.py \
            scripts/patch_s4_2.py \
            scripts/patch_s4_3.py \
            .github/workflows/apply-s1-s4.yml \
            integration-failure.log
          git commit -m "Add concurrent debugging intelligence and deterministic replay"
          git push origin HEAD:agent/debugging-intelligence-s1-s4
