name: Bevy 0.19 Correctness Validation

on:
  push:
    branches: [audit/bevy-0.19-correctness]

permissions:
  contents: write

concurrency:
  group: bevy019-correctness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/bevy-0.19-correctness
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Apply audited Bevy fixes
        run: |
          python .github/bevy019_apply.py
          python .github/bevy019_supervisor_clippy.py
      - name: Format
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Commit exact validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/bevy019_apply.py .github/bevy019_supervisor_clippy.py .github/workflows/bevy019-validation.yml
          git add -- \
            crates/bevy-mcp-host/src/debugger.rs \
            crates/bevy-mcp-host/src/operations.rs \
            crates/bevy-mcp-host/src/plugin.rs \
            crates/bevy-mcp-host/src/schedule.rs \
            crates/bevy-mcp-host/src/synthetic_input.rs \
            crates/bevy-mcp-host/src/systems.rs \
            crates/bevy-mcp-host/src/systems/capabilities.rs \
            crates/bevy-mcp-host/src/systems/ecs_inspect.rs \
            crates/bevy-mcp-host/src/systems/ecs_mutate.rs \
            crates/bevy-mcp-host/src/systems/procedural.rs \
            crates/bevy-mcp-host/src/systems/resources.rs \
            crates/bevy-mcp-host/src/systems/runtime.rs \
            crates/bevy-mcp-host/src/lib.rs \
            crates/bevy-mcp-supervisor/src/backend.rs \
            crates/bevy-mcp-supervisor/src/cargo_executor.rs \
            crates/bevy-mcp-supervisor/src/process_manager.rs \
            crates/bevy-mcp-supervisor/src/process_tools.rs \
            Cargo.toml
          git diff --cached --check
          git commit -m "fix: align host behavior with Bevy 0.19 semantics"
          git push origin HEAD:audit/bevy-0.19-correctness
