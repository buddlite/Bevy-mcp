name: Bootstrap atomic mutation batch

on:
  pull_request:
    branches:
      - v.01
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: bootstrap-atomic-mutation-batch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atomic-mutation-batch
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Apply source transformation
        run: python .github/bootstrap_atomic_mutation_batch.py
      - name: Fix core entity-handle qualification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/bevy-mcp-host/src/systems.rs")
          text = path.read_text(encoding="utf-8")
          old = "entity_handle: &EntityHandle,"
          count = text.count(old)
          if count != 2:
              raise RuntimeError(f"expected 2 EntityHandle helper signatures, found {count}")
          path.write_text(
              text.replace(
                  old,
                  "entity_handle: &bevy_mcp_core::entity_handle::EntityHandle,",
              ),
              encoding="utf-8",
          )
          PY
      - name: Format workspace
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Commit validated implementation
        run: |
          rm .github/bootstrap_atomic_mutation_batch.py .github/workflows/bootstrap-atomic-mutation-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            crates/bevy-mcp-core/src/command.rs \
            crates/bevy-mcp-host/src/deferred.rs \
            crates/bevy-mcp-host/src/systems.rs \
            crates/bevy-mcp-host/tests/atomic_mutation_batch.rs \
            crates/bevy-mcp-server/src/tools.rs \
            .github/bootstrap_atomic_mutation_batch.py \
            .github/workflows/bootstrap-atomic-mutation-batch.yml
          git diff --cached --check
          git commit -m "Add atomic mutation batches"
          git push origin HEAD:agent/atomic-mutation-batch
