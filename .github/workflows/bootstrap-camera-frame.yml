name: Bootstrap camera framing

on:
  pull_request:
    branches:
      - v.01
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: bootstrap-camera-frame-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounds-aware-camera-frame
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Apply source transformation
        run: python .github/bootstrap_camera_frame.py
      - name: Apply Bevy 0.19 projection defaults
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/bevy-mcp-host/tests/interaction.rs")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          output = []
          in_perspective = False
          has_required_default = False
          patched = 0

          for line in lines:
              if "bevy::camera::PerspectiveProjection {" in line:
                  in_perspective = True
                  has_required_default = False

              if in_perspective and ("..default()" in line or "near_clip_plane:" in line):
                  has_required_default = True

              if in_perspective and line.strip() == "}),":
                  if not has_required_default:
                      indent = line[: len(line) - len(line.lstrip())]
                      output.append(f"{indent}    ..default()\n")
                      patched += 1
                  in_perspective = False

              output.append(line)

          if patched == 0:
              raise RuntimeError("expected at least one PerspectiveProjection initializer to patch")

          path.write_text("".join(output), encoding="utf-8")
          print(f"patched {patched} PerspectiveProjection initializer(s)")
          PY
      - name: Format workspace
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Commit validated implementation
        run: |
          rm .github/bootstrap_camera_frame.py .github/workflows/bootstrap-camera-frame.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/bevy-mcp-core/src/command.rs \
            crates/bevy-mcp-host/src/deferred.rs \
            crates/bevy-mcp-host/src/systems.rs \
            crates/bevy-mcp-host/tests/interaction.rs \
            crates/bevy-mcp-server/src/tools.rs \
            .github/bootstrap_camera_frame.py \
            .github/workflows/bootstrap-camera-frame.yml
          git diff --cached --check
          git commit -m "Add bounds-aware camera framing"
          git push origin HEAD:agent/bounds-aware-camera-frame
