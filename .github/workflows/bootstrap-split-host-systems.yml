name: Bootstrap split host systems

on:
  pull_request:
    branches:
      - v.01
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: bootstrap-split-host-systems-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  split-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/split-host-systems
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Apply systems module split
        run: python .github/bootstrap_split_systems.py
      - name: Format workspace
        run: cargo fmt --all
      - name: Validate structural boundary
        run: |
          test $(wc -c < crates/bevy-mcp-host/src/systems.rs) -lt 5000
          test -f crates/bevy-mcp-host/src/systems/dispatch.rs
          test -f crates/bevy-mcp-host/src/systems/ecs_inspect.rs
          test -f crates/bevy-mcp-host/src/systems/ecs_mutate.rs
          test -f crates/bevy-mcp-host/src/systems/capabilities.rs
          test -f crates/bevy-mcp-host/src/systems/assets.rs
          test -f crates/bevy-mcp-host/src/systems/camera.rs
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Commit validated refactor
        run: |
          rm .github/bootstrap_split_systems.py .github/workflows/bootstrap-split-host-systems.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/bevy-mcp-host/src/systems.rs \
            crates/bevy-mcp-host/src/systems/assertions.rs \
            crates/bevy-mcp-host/src/systems/assets.rs \
            crates/bevy-mcp-host/src/systems/camera.rs \
            crates/bevy-mcp-host/src/systems/capabilities.rs \
            crates/bevy-mcp-host/src/systems/dispatch.rs \
            crates/bevy-mcp-host/src/systems/ecs_inspect.rs \
            crates/bevy-mcp-host/src/systems/ecs_mutate.rs \
            crates/bevy-mcp-host/src/systems/input.rs \
            crates/bevy-mcp-host/src/systems/procedural.rs \
            crates/bevy-mcp-host/src/systems/resources.rs \
            crates/bevy-mcp-host/src/systems/runtime.rs \
            crates/bevy-mcp-host/src/systems/ui.rs \
            .github/bootstrap_split_systems.py \
            .github/workflows/bootstrap-split-host-systems.yml
          git diff --cached --check
          git commit -m "Split host systems by domain"
          git push origin HEAD:refactor/split-host-systems
