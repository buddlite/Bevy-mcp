name: Bootstrap supervisor stage 1

on:
  push:
    branches:
      - stage1/supervisor-foundation
  pull_request:
    branches:
      - v.01

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage1/supervisor-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Integrate Stage 1 sources
        run: |
          python scripts/bootstrap_supervisor_stage1.py
          python scripts/fix_supervisor_stage1_status.py
          python scripts/fix_supervisor_stage1_entity_uris.py
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Verify Stage 1 architecture boundaries
        run: |
          ! grep -R "dispatcher:" crates/bevy-mcp-server/src/advanced_tools.rs crates/bevy-mcp-server/src/debug_tools.rs
          ! grep -R "state.connected" crates/bevy-mcp-server/src
          grep -q 'pub mod backend;' crates/bevy-mcp-server/src/lib.rs
          grep -q 'crates/bevy-mcp-supervisor' Cargo.toml
          grep -q 'STALE_INSTANCE' crates/bevy-mcp-host/src/entity_handle.rs
          grep -q 'HostProbe' crates/bevy-mcp-core/src/command.rs
          grep -q 'instance_id: String' crates/bevy-mcp-host/src/change_tracking.rs
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.toml Cargo.lock crates/bevy-mcp-core crates/bevy-mcp-host crates/bevy-mcp-server crates/bevy-mcp-supervisor
          git rm -- scripts/bootstrap_supervisor_stage1.py scripts/fix_supervisor_stage1_status.py scripts/fix_supervisor_stage1_entity_uris.py .github/workflows/bootstrap-supervisor-stage1.yml
          git commit -m "Implement supervisor foundation stage 1"
          git push origin HEAD:stage1/supervisor-foundation
