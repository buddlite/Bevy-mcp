name: Finalize validated supervisor stage 2

on:
  pull_request:
    branches:
      - v.01

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2/process-manager
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce already-validated Stage 2 sources
        run: |
          python scripts/prepare_supervisor_stage2.py
          python scripts/bootstrap_supervisor_stage2.py
          python scripts/fix_supervisor_stage2_lifecycle.py
          cargo fmt --all
          cargo generate-lockfile
      - name: Publish validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock crates/bevy-mcp-host crates/bevy-mcp-supervisor
          git rm -f -- scripts/bootstrap_supervisor_stage2.py scripts/prepare_supervisor_stage2.py scripts/fix_supervisor_stage2_lifecycle.py
          git commit -m "Implement supervisor process manager stage 2"
          git push origin HEAD:stage2/process-manager
