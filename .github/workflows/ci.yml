name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace

  harden-agent-interaction:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/agent-interaction'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agent-interaction
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Apply interaction hardening
        run: python scripts/harden_agent_interaction.py
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Commit validated hardening and remove bootstrap
        run: |
          rm scripts/harden_agent_interaction.py
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
            pull_request:

          jobs:
            rust:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                - name: Install Bevy Linux dependencies
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y --no-install-recommends \
                      libasound2-dev \
                      libudev-dev \
                      libwayland-dev \
                      libxkbcommon-dev
                - name: Check workspace
                  run: cargo check --workspace --all-targets
                - name: Test workspace
                  run: cargo test --workspace
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/bevy-mcp-host/src/interaction.rs \
            docs/agent-interaction.md \
            docs/tool-capabilities.md \
            .github/workflows/ci.yml \
            scripts/harden_agent_interaction.py
          git commit -m "Harden Agent Interaction for scaled UI"
          git push origin HEAD:agent/agent-interaction
