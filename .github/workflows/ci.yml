name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace

  integrate-asset-path-tools:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/asset-path-tools'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/asset-path-tools
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Apply asset path tools
        run: python scripts/reapply_asset_path_tools.py
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Commit validated asset tools and remove bootstrap
        run: |
          rm scripts/reapply_asset_path_tools.py
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
            pull_request:

          jobs:
            rust:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                - name: Install Bevy Linux dependencies
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y --no-install-recommends \
                      libasound2-dev \
                      libudev-dev \
                      libwayland-dev \
                      libxkbcommon-dev
                - name: Check workspace
                  run: cargo check --workspace --all-targets
                - name: Test workspace
                  run: cargo test --workspace
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/bevy-mcp-host/src/systems.rs \
            crates/bevy-mcp-host/tests/assets.rs \
            crates/bevy-mcp-server/src/tools.rs \
            docs/tool-capabilities.md \
            .github/workflows/ci.yml \
            scripts/reapply_asset_path_tools.py
          git commit -m "Add asset path inspection and reload tools"
          git push origin HEAD:agent/asset-path-tools
