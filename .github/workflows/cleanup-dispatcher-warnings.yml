name: One-time dispatcher warning cleanup

on:
  push:
    paths:
      - scripts/cleanup_dispatcher_warnings.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/debugging-intelligence-s1-s4
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Apply cleanup
        run: python scripts/cleanup_dispatcher_warnings.py
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/bevy-mcp-server/src/advanced_tools.rs \
            crates/bevy-mcp-server/src/debug_tools.rs \
            crates/bevy-mcp-server/src/tools.rs
          git rm -- .github/workflows/cleanup-dispatcher-warnings.yml scripts/cleanup_dispatcher_warnings.py
          git commit -m "Clean dispatcher refactor warnings"
          git push origin HEAD:agent/debugging-intelligence-s1-s4
