name: Release binaries

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [v.01]
    paths:
      - ".github/workflows/release.yml"
      - "crates/bevy-mcp-supervisor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"
      - "QUICKSTART.md"
      - "docs/install.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: bevy-mcp-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: bevy-mcp-windows-x86_64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bevy Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Build supervisor binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p bevy-mcp-supervisor --bin bevy-mcp

      - name: Stage Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/bevy-mcp
          cp "target/${{ matrix.target }}/release/bevy-mcp" dist/bevy-mcp/bevy-mcp
          cp README.md QUICKSTART.md LICENSE-MIT LICENSE-APACHE dist/bevy-mcp/
          cp docs/install.md dist/bevy-mcp/INSTALL.md
          tar -C dist -czf "dist/${{ matrix.archive }}" bevy-mcp
          (cd dist && sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256")

      - name: Stage Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/bevy-mcp | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bevy-mcp.exe" dist/bevy-mcp/bevy-mcp.exe
          Copy-Item README.md, QUICKSTART.md, LICENSE-MIT, LICENSE-APACHE dist/bevy-mcp/
          Copy-Item docs/install.md dist/bevy-mcp/INSTALL.md
          Compress-Archive -Path dist/bevy-mcp -DestinationPath "dist/${{ matrix.archive }}"
          $hash = (Get-FileHash "dist/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.archive }}" | Set-Content "dist/${{ matrix.archive }}.sha256"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        run: |
          prerelease=()
          case "$RELEASE_TAG" in
            *-alpha*|*-beta*|*-rc*) prerelease=(--prerelease) ;;
          esac

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              "${prerelease[@]}"
          fi
