name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: bevy-mcp-linux-x86_64.tar.gz
            binary: bevy-mcp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: bevy-mcp-windows-x86_64.zip
            binary: bevy-mcp.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bevy Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Build supervisor binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p bevy-mcp-supervisor

      - name: Stage Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/bevy-mcp
          cp "target/${{ matrix.target }}/release/bevy-mcp" dist/bevy-mcp/bevy-mcp
          cp README.md QUICKSTART.md LICENSE-MIT LICENSE-APACHE dist/bevy-mcp/
          tar -C dist -czf "dist/${{ matrix.archive }}" bevy-mcp
          (cd dist && sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256")

      - name: Stage Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/bevy-mcp | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bevy-mcp.exe" dist/bevy-mcp/bevy-mcp.exe
          Copy-Item README.md, QUICKSTART.md, LICENSE-MIT, LICENSE-APACHE dist/bevy-mcp/
          Compress-Archive -Path dist/bevy-mcp/* -DestinationPath "dist/${{ matrix.archive }}"
          $hash = (Get-FileHash "dist/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.archive }}" | Set-Content -NoNewline "dist/${{ matrix.archive }}.sha256"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.name, '-alpha') || contains(steps.tag.outputs.name, '-beta') || contains(steps.tag.outputs.name, '-rc') }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
