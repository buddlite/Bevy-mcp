name: Stage 3 Cargo Executor Bootstrap

on:
  push:
    branches:
      - stage3/cargo-executor
  pull_request:
    branches:
      - v.01

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/cargo-executor
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Apply Stage 3 source
        shell: python
        run: |
          import base64, gzip, pathlib
          files = {
              'crates/bevy-mcp-supervisor/src/cargo_executor.rs': '',
              'crates/bevy-mcp-supervisor/src/permissions.rs': '',
              'crates/bevy-mcp-supervisor/src/process_tools.rs': '',
              'crates/bevy-mcp-supervisor/src/main.rs': '',
              'crates/bevy-mcp-supervisor/src/lib.rs': '',
          }
          for path, payload in files.items():
              target = pathlib.Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(base64.b64decode(payload)))
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Commit validated Stage 3 implementation
        run: |
          rm .github/workflows/stage3-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/bevy-mcp-supervisor/src/cargo_executor.rs crates/bevy-mcp-supervisor/src/permissions.rs crates/bevy-mcp-supervisor/src/process_tools.rs crates/bevy-mcp-supervisor/src/main.rs crates/bevy-mcp-supervisor/src/lib.rs .github/workflows/stage3-bootstrap.yml
          git commit -m "Implement Stage 3 Cargo executor"
          git push origin HEAD:stage3/cargo-executor
