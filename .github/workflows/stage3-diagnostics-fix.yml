name: Stage 3 Diagnostics Fix

on:
  push:
    branches:
      - stage3/cargo-executor

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/cargo-executor
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix Cargo diagnostic message mode
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/bevy-mcp-supervisor/src/cargo_executor.rs')
          text = path.read_text()
          old = '"--message-format=json-render-diagnostics".to_string(),'
          new = '"--message-format=json".to_string(),'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one diagnostic mode occurrence, found {text.count(old)}')
          path.write_text(text.replace(old, new))
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test supervisor Stage 3 gates
        run: cargo test -p bevy-mcp-supervisor --lib
      - name: Commit validated fix and remove bootstrap
        run: |
          rm .github/workflows/stage3-diagnostics-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- crates/bevy-mcp-supervisor/src/cargo_executor.rs .github/workflows/stage3-diagnostics-fix.yml
          git commit -m "Fix structured Cargo diagnostics"
          git push origin HEAD:stage3/cargo-executor
