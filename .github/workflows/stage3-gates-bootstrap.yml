name: Stage 3 Acceptance Gates Bootstrap

on:
  push:
    branches:
      - stage3/cargo-executor
  pull_request:
    branches:
      - v.01

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/cargo-executor
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Add Stage 3 acceptance fixtures
        shell: python
        run: |
          import base64, gzip, pathlib
          pathlib.Path('crates/bevy-mcp-supervisor/src/cargo_executor.rs').write_bytes(
              gzip.decompress(base64.b64decode(''))
          )
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Run supervisor Stage 3 tests
        run: cargo test -p bevy-mcp-supervisor --lib
      - name: Commit validated acceptance fixtures
        run: |
          rm .github/workflows/stage3-gates-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/bevy-mcp-supervisor/src/cargo_executor.rs .github/workflows/stage3-gates-bootstrap.yml
          git commit -m "Add Stage 3 Cargo acceptance fixtures"
          git push origin HEAD:stage3/cargo-executor
