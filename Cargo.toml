[workspace]
resolver = "2"
members = [
    "crates/bevy-mcp-core",
    "crates/bevy-mcp-host",
    "crates/bevy-mcp-server",
    "crates/bevy-mcp-supervisor",
    "examples/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/buddlite/Bevy-mcp"
homepage = "https://github.com/buddlite/Bevy-mcp"
documentation = "https://docs.rs/bevy-mcp-server"
readme = "README.md"
keywords = ["bevy", "mcp", "ai", "gamedev", "ecs"]
categories = ["game-development", "development-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
